# hotSwap-complete campaign for the reduced ComputeCluster family used after
# the N=4, MaxLevel=8 T1 Stepwise/Traditional runs reached the 12-hour limit.
# MaxLevel=6 fixes the NEW per-node cap and adjacent-pair budget at 3.
outputDir: "out/h6/cc6/result"
runs: 3
timeoutHours: 12
requireFreshOutputDir: false
# Execute no_tr -> T1 -> T2. Within each variant, run N=3 then N=4 and swap
# Stepwise/Traditional order on even-numbered runs.
alternateMethodOrderByRun: true
validateMethodTarget: true
validateMemoryQuality: true
# RSS gap is hard-fail; heap gap remains diagnostic without maxHeapSamplingGapMillis.
maxRssSamplingGapMillis: 1000
requirementsCheck: false
traceCheck: false
# Add a local webhook and change this setting only when notifications are needed.
notifyOn: never
notifyTimeoutSeconds: 30

javaOptions:
  - -Djava.awt.headless=true
  - -Dmtsa.evaluation.enabled=true
  - -Dupdating.controller.evaluation.profile=paper
  - -Dmtsa.evaluation.memorySampling.enabled=true
  - -Dmtsa.evaluation.memorySampling.intervalMillis=50
  - -Dmtsa.evaluation.rssSampling.enabled=true
  - -Dmtsa.evaluation.rssSampling.intervalMillis=50
  - -Dmtsa.evaluation.rssSampling.providerTimeoutMillis=5000
  - -Dmtsa.evaluation.memoryProtocol.ackTimeoutMillis=30000
  - -Dmtsa.evaluation.windowsPeakWorkingSet.enabled=false
  - -Dmtsa.evaluation.phaseMemoryDiagnostics=false
  - -Dstepwise.delayed.connectedEnvironmentView=true
  - -XX:+UseG1GC
  - -XX:+UnlockExperimentalVMOptions
  - -XX:G1MaxNewSizePercent=20
  - -Xmx220g

cases:
  # no_tr: N=3, then N=4.
  - id: cc3l6_s_n_h6
    example: CC_HalfCap_N3_L6
    method: stepwise_delayed+SBP
    variant: no_tr
    lts: "Experiment/LTS/ComputeCluster/ComputeCluster_3Nodes_MaxLevel6_HalfCapAdjacentPowerBudgetPolicyRollout_Update.lts"
    target: Stepwise_UpdCont_hotSwap
  - id: cc3l6_t_n_h6
    example: CC_HalfCap_N3_L6
    method: Traditional
    variant: no_tr
    lts: "Experiment/LTS/ComputeCluster/ComputeCluster_3Nodes_MaxLevel6_HalfCapAdjacentPowerBudgetPolicyRollout_Update.lts"
    target: UpdCont
  - id: cc4l6_s_n_h6
    example: CC_HalfCap_N4_L6
    method: stepwise_delayed+SBP
    variant: no_tr
    lts: "Experiment/LTS/ComputeCluster/ComputeCluster_4Nodes_MaxLevel6_HalfCapAdjacentPowerBudgetPolicyRollout_Update.lts"
    target: Stepwise_UpdCont_hotSwap
  - id: cc4l6_t_n_h6
    example: CC_HalfCap_N4_L6
    method: Traditional
    variant: no_tr
    lts: "Experiment/LTS/ComputeCluster/ComputeCluster_4Nodes_MaxLevel6_HalfCapAdjacentPowerBudgetPolicyRollout_Update.lts"
    target: UpdCont

  # T1: N=3, then N=4.
  - id: cc3l6_s_1_h6
    example: CC_HalfCap_N3_L6
    method: stepwise_delayed+SBP
    variant: t1_no_controllable_during_gap
    lts: "Experiment/LTS/ComputeCluster/ComputeCluster_3Nodes_MaxLevel6_HalfCapAdjacentPowerBudgetPolicyRollout_Update.lts"
    target: Stepwise_UpdCont_T1_hotSwap
  - id: cc3l6_t_1_h6
    example: CC_HalfCap_N3_L6
    method: Traditional
    variant: t1_no_controllable_during_gap
    lts: "Experiment/LTS/ComputeCluster/ComputeCluster_3Nodes_MaxLevel6_HalfCapAdjacentPowerBudgetPolicyRollout_Update.lts"
    target: UpdCont_T1
  - id: cc4l6_s_1_h6
    example: CC_HalfCap_N4_L6
    method: stepwise_delayed+SBP
    variant: t1_no_controllable_during_gap
    lts: "Experiment/LTS/ComputeCluster/ComputeCluster_4Nodes_MaxLevel6_HalfCapAdjacentPowerBudgetPolicyRollout_Update.lts"
    target: Stepwise_UpdCont_T1_hotSwap
  - id: cc4l6_t_1_h6
    example: CC_HalfCap_N4_L6
    method: Traditional
    variant: t1_no_controllable_during_gap
    lts: "Experiment/LTS/ComputeCluster/ComputeCluster_4Nodes_MaxLevel6_HalfCapAdjacentPowerBudgetPolicyRollout_Update.lts"
    target: UpdCont_T1

  # T2: N=3, then N=4.
  - id: cc3l6_s_2_h6
    example: CC_HalfCap_N3_L6
    method: stepwise_delayed+SBP
    variant: t2_start_after_stop_and_reconfigure
    lts: "Experiment/LTS/ComputeCluster/ComputeCluster_3Nodes_MaxLevel6_HalfCapAdjacentPowerBudgetPolicyRollout_Update.lts"
    target: Stepwise_UpdCont_T2_hotSwap
  - id: cc3l6_t_2_h6
    example: CC_HalfCap_N3_L6
    method: Traditional
    variant: t2_start_after_stop_and_reconfigure
    lts: "Experiment/LTS/ComputeCluster/ComputeCluster_3Nodes_MaxLevel6_HalfCapAdjacentPowerBudgetPolicyRollout_Update.lts"
    target: UpdCont_T2
  - id: cc4l6_s_2_h6
    example: CC_HalfCap_N4_L6
    method: stepwise_delayed+SBP
    variant: t2_start_after_stop_and_reconfigure
    lts: "Experiment/LTS/ComputeCluster/ComputeCluster_4Nodes_MaxLevel6_HalfCapAdjacentPowerBudgetPolicyRollout_Update.lts"
    target: Stepwise_UpdCont_T2_hotSwap
  - id: cc4l6_t_2_h6
    example: CC_HalfCap_N4_L6
    method: Traditional
    variant: t2_start_after_stop_and_reconfigure
    lts: "Experiment/LTS/ComputeCluster/ComputeCluster_4Nodes_MaxLevel6_HalfCapAdjacentPowerBudgetPolicyRollout_Update.lts"
    target: UpdCont_T2
