# hotSwap-complete campaign: Stepwise cases use LTS targets with
# traditionalHotSwapMonitorSemantics; Traditional cases remain baselines.
# Final paper-evaluation run for the adjacent-demand-response EVCharging family.
# MaxSOC=1 and MaxRate=6 are fixed while N=3 and N=4 differ only in charger count.
outputDir: "out/h6/ev1/result"
runs: 3
timeoutHours: 12
requireFreshOutputDir: false
# Execute no_tr -> T1 -> T2. Within each variant, run N=3 then N=4 and
# swap Stepwise/Traditional order on even-numbered runs.
alternateMethodOrderByRun: true
validateMethodTarget: true
validateMemoryQuality: true
# RSS gap is hard-fail; heap gap remains diagnostic without maxHeapSamplingGapMillis.
maxRssSamplingGapMillis: 1000
requirementsCheck: false
traceCheck: false
notifyOn: always
# slackWebhookUrl: "<redacted-slack-webhook-url>" # optional; set locally before running.
notifyTimeoutSeconds: 30

javaOptions:
  - -Djava.awt.headless=true
  - -Dmtsa.evaluation.enabled=true
  - -Dupdating.controller.evaluation.profile=paper
  - -Dmtsa.evaluation.memorySampling.enabled=true
  - -Dmtsa.evaluation.memorySampling.intervalMillis=50
  - -Dmtsa.evaluation.rssSampling.enabled=true
  - -Dmtsa.evaluation.rssSampling.intervalMillis=50
  - -Dmtsa.evaluation.rssSampling.providerTimeoutMillis=5000
  - -Dmtsa.evaluation.memoryProtocol.ackTimeoutMillis=30000
  - -Dmtsa.evaluation.windowsPeakWorkingSet.enabled=false
  - -Dmtsa.evaluation.phaseMemoryDiagnostics=false
  - -Dstepwise.delayed.connectedEnvironmentView=true
  - -XX:+UseG1GC
  - -XX:+UnlockExperimentalVMOptions
  - -XX:G1MaxNewSizePercent=20
  - -Xmx220g

cases:
  # no_tr: N=3, then N=4.
  - id: ev3s1_s_n_h6
    example: EV_ADR_N3_S1
    method: stepwise_delayed+SBP
    variant: no_tr
    lts: "Experiment/LTS/EVCharging/EVCharging_3Chargers_MaxSOC1_AdjacentDemandResponsePolicyRollout_Update.lts"
    target: Stepwise_UpdCont_hotSwap
  - id: ev3s1_t_n_h6
    example: EV_ADR_N3_S1
    method: Traditional
    variant: no_tr
    lts: "Experiment/LTS/EVCharging/EVCharging_3Chargers_MaxSOC1_AdjacentDemandResponsePolicyRollout_Update.lts"
    target: UpdCont
  - id: ev4s1_s_n_h6
    example: EV_ADR_N4_S1
    method: stepwise_delayed+SBP
    variant: no_tr
    lts: "Experiment/LTS/EVCharging/EVCharging_4Chargers_MaxSOC1_AdjacentDemandResponsePolicyRollout_Update.lts"
    target: Stepwise_UpdCont_hotSwap
  - id: ev4s1_t_n_h6
    example: EV_ADR_N4_S1
    method: Traditional
    variant: no_tr
    lts: "Experiment/LTS/EVCharging/EVCharging_4Chargers_MaxSOC1_AdjacentDemandResponsePolicyRollout_Update.lts"
    target: UpdCont

  # T1: N=3, then N=4.
  - id: ev3s1_s_1_h6
    example: EV_ADR_N3_S1
    method: stepwise_delayed+SBP
    variant: t1_no_controllable_during_gap
    lts: "Experiment/LTS/EVCharging/EVCharging_3Chargers_MaxSOC1_AdjacentDemandResponsePolicyRollout_Update.lts"
    target: Stepwise_UpdCont_T1_hotSwap
  - id: ev3s1_t_1_h6
    example: EV_ADR_N3_S1
    method: Traditional
    variant: t1_no_controllable_during_gap
    lts: "Experiment/LTS/EVCharging/EVCharging_3Chargers_MaxSOC1_AdjacentDemandResponsePolicyRollout_Update.lts"
    target: UpdCont_T1
  - id: ev4s1_s_1_h6
    example: EV_ADR_N4_S1
    method: stepwise_delayed+SBP
    variant: t1_no_controllable_during_gap
    lts: "Experiment/LTS/EVCharging/EVCharging_4Chargers_MaxSOC1_AdjacentDemandResponsePolicyRollout_Update.lts"
    target: Stepwise_UpdCont_T1_hotSwap
  - id: ev4s1_t_1_h6
    example: EV_ADR_N4_S1
    method: Traditional
    variant: t1_no_controllable_during_gap
    lts: "Experiment/LTS/EVCharging/EVCharging_4Chargers_MaxSOC1_AdjacentDemandResponsePolicyRollout_Update.lts"
    target: UpdCont_T1

  # T2: N=3, then N=4.
  - id: ev3s1_s_2_h6
    example: EV_ADR_N3_S1
    method: stepwise_delayed+SBP
    variant: t2_start_after_stop_and_reconfigure
    lts: "Experiment/LTS/EVCharging/EVCharging_3Chargers_MaxSOC1_AdjacentDemandResponsePolicyRollout_Update.lts"
    target: Stepwise_UpdCont_T2_hotSwap
  - id: ev3s1_t_2_h6
    example: EV_ADR_N3_S1
    method: Traditional
    variant: t2_start_after_stop_and_reconfigure
    lts: "Experiment/LTS/EVCharging/EVCharging_3Chargers_MaxSOC1_AdjacentDemandResponsePolicyRollout_Update.lts"
    target: UpdCont_T2
  - id: ev4s1_s_2_h6
    example: EV_ADR_N4_S1
    method: stepwise_delayed+SBP
    variant: t2_start_after_stop_and_reconfigure
    lts: "Experiment/LTS/EVCharging/EVCharging_4Chargers_MaxSOC1_AdjacentDemandResponsePolicyRollout_Update.lts"
    target: Stepwise_UpdCont_T2_hotSwap
  - id: ev4s1_t_2_h6
    example: EV_ADR_N4_S1
    method: Traditional
    variant: t2_start_after_stop_and_reconfigure
    lts: "Experiment/LTS/EVCharging/EVCharging_4Chargers_MaxSOC1_AdjacentDemandResponsePolicyRollout_Update.lts"
    target: UpdCont_T2
