outputDir: "Experiment/result"
runs: 1
timeoutHours: 12
requirementsCheck: true
traceCheck: true
notifyOn: always
# slackWebhookUrl: "https://hooks.slack.com/services/..." # optional; set locally before running.
notifyTimeoutSeconds: 30

javaOptions:
  - -Djava.awt.headless=true
  - -Dmtsa.evaluation.enabled=true
  - -Xmx220g

cases:
  - id: drone_2x2x2_to_3x3x2_traditional_no_tr
    example: Drone_2x2x2_to_3x3x2
    method: Traditional
    variant: no_tr
    lts: "Experiment/LTS/Drone/Drone_2x2x2_to_3x3x2/Drone_2x2x2_to_3x3x2_traditional_no_tr.lts"
    target: UpdCont
  - id: drone_2x2x2_to_3x3x2_traditional_sbp_no_tr
    example: Drone_2x2x2_to_3x3x2
    method: Traditional+SBP
    variant: no_tr_sbp
    lts: "Experiment/LTS/Drone/Drone_2x2x2_to_3x3x2/Drone_2x2x2_to_3x3x2_traditional+SBP_no_tr.lts"
    target: UpdCont_SBP
  - id: drone_2x2x2_to_3x3x2_stepwise_delayed_no_tr
