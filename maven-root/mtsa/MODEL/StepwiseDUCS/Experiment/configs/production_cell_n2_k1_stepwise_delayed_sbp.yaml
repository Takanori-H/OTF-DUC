outputDir: "Experiment/result"
runs: 1
timeoutHours: 12
requirementsCheck: true
traceCheck: true
notifyOn: always
# slackWebhookUrl: "https://hooks.slack.com/services/..." # optional; set locally before running.
notifyTimeoutSeconds: 30

javaOptions:
  - -Djava.awt.headless=true
  - -Dmtsa.evaluation.enabled=true
  - -Xmx220g

cases:
  - id: pc_n2_k1_traditional_no_tr
    example: ProductionCell_N=2_K=1
    method: Traditional
    variant: no_tr
    lts: "Experiment/LTS/ProductionCell/ProductionCell_N=2, K=1/ProductionCell_N=2, K=1_traditional_no_tr.lts"
    target: UPDATE_CONTROLLER
  - id: pc_n2_k1_traditional_sbp_no_tr
    example: ProductionCell_N=2_K=1
    method: Traditional+SBP
    variant: no_tr_sbp
    lts: "Experiment/LTS/ProductionCell/ProductionCell_N=2, K=1/ProductionCell_N=2, K=1_traditional+SBP_no_tr.lts"
    target: UPDATE_CONTROLLER_SBP
  - id: pc_n2_k1_stepwise_delayed_no_tr
    example: ProductionCell_N=2_K=1
    method: stepwise_delayed
    variant: no_tr
    lts: "Experiment/LTS/ProductionCell/ProductionCell_N=2, K=1/ProductionCell_N=2, K=1_stepwise_delayed_no_tr.lts"
    target: STEPWISE_DELAYED_UPDATE_CONTROLLER
  - id: pc_n2_k1_stepwise_delayed_sbp_no_tr
    example: ProductionCell_N=2_K=1
    method: stepwise_delayed+SBP
    variant: no_tr_sbp
    lts: "Experiment/LTS/ProductionCell/ProductionCell_N=2, K=1/ProductionCell_N=2, K=1_stepwise_delayed+SBP_no_tr.lts"
    target: STEPWISE_DELAYED_UPDATE_CONTROLLER_SBP

