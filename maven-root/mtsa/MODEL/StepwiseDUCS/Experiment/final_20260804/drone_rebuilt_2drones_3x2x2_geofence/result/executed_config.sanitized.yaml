# Final paper-evaluation rerun for the rebuilt two-drone 3x2x2 geofence model.
#
# Run this configuration from the StepwiseDUCS distribution root (the
# directory that directly contains Experiment/) with the exact evaluation jar
# prepared for the final campaign. Existing run directories may be reused and
# matching artifacts overwritten when the experiment is intentionally rerun.
# JFR, phase-memory diagnostics, diagnostic GC logging, and the Windows-native
# lifetime high-water probe are disabled. The common 50 ms synthesis-window
# memory measurements remain enabled as paper metrics.
outputDir: "Experiment/final_20260804/drone_rebuilt_2drones_3x2x2_geofence/result"
runs: 3
timeoutHours: 12
requireFreshOutputDir: false
# Keep no_tr -> T1 -> T2 fixed, but swap the two methods inside each pair on
# even-numbered runs to avoid a fixed Stepwise-first execution-order bias.
alternateMethodOrderByRun: true
validateMethodTarget: true
validateMemoryQuality: true
maxMemorySamplingGapMillis: 1000
requirementsCheck: false
traceCheck: false
notifyOn: always
slackWebhookUrl: "<redacted>"
notifyTimeoutSeconds: 30

javaOptions:
  - -Djava.awt.headless=true
  - -Dmtsa.evaluation.enabled=true
  - -Dupdating.controller.evaluation.profile=paper
  - -Dmtsa.evaluation.memorySampling.enabled=true
  - -Dmtsa.evaluation.memorySampling.intervalMillis=50
  - -Dmtsa.evaluation.rssSampling.enabled=true
  - -Dmtsa.evaluation.rssSampling.intervalMillis=50
  - -Dmtsa.evaluation.rssSampling.providerTimeoutMillis=5000
  - -Dmtsa.evaluation.memoryProtocol.ackTimeoutMillis=30000
  - -Dmtsa.evaluation.windowsPeakWorkingSet.enabled=false
  - -Dmtsa.evaluation.phaseMemoryDiagnostics=false
  - -Dstepwise.delayed.connectedEnvironmentView=true
  - -XX:+UseG1GC
  - -XX:+UnlockExperimentalVMOptions
  - -XX:G1MaxNewSizePercent=20
  - -Xmx220g

cases:
  - id: drone_rebuilt_2drones_3x2x2_arrive_geofence_stepwise_delayed_sbp_no_tr
    example: DroneRebuilt_TemporaryArriveGeofencePolicyRollout_2Drones_3x2x2
    method: stepwise_delayed+SBP
    variant: no_tr
    lts: "Experiment/LTS/DroneRebuilt/Drone_2Drones_3x2x2_TemporaryGeofencePolicyRollout_Update.lts"
    target: Stepwise_UpdCont

  - id: drone_rebuilt_2drones_3x2x2_arrive_geofence_traditional_no_tr
    example: DroneRebuilt_TemporaryArriveGeofencePolicyRollout_2Drones_3x2x2
    method: Traditional
    variant: no_tr
    lts: "Experiment/LTS/DroneRebuilt/Drone_2Drones_3x2x2_TemporaryGeofencePolicyRollout_Update.lts"
    target: UpdCont

  - id: drone_rebuilt_2drones_3x2x2_arrive_geofence_stepwise_delayed_sbp_t1_no_controllable_during_gap
    example: DroneRebuilt_TemporaryArriveGeofencePolicyRollout_2Drones_3x2x2
    method: stepwise_delayed+SBP
    variant: t1_no_controllable_during_gap
    lts: "Experiment/LTS/DroneRebuilt/Drone_2Drones_3x2x2_TemporaryGeofencePolicyRollout_Update.lts"
    target: Stepwise_UpdCont_T1

  - id: drone_rebuilt_2drones_3x2x2_arrive_geofence_traditional_t1_no_controllable_during_gap
    example: DroneRebuilt_TemporaryArriveGeofencePolicyRollout_2Drones_3x2x2
    method: Traditional
    variant: t1_no_controllable_during_gap
    lts: "Experiment/LTS/DroneRebuilt/Drone_2Drones_3x2x2_TemporaryGeofencePolicyRollout_Update.lts"
    target: UpdCont_T1

  - id: drone_rebuilt_2drones_3x2x2_arrive_geofence_stepwise_delayed_sbp_t2_start_after_stop_and_reconfigure
    example: DroneRebuilt_TemporaryArriveGeofencePolicyRollout_2Drones_3x2x2
    method: stepwise_delayed+SBP
    variant: t2_start_after_stop_and_reconfigure
    lts: "Experiment/LTS/DroneRebuilt/Drone_2Drones_3x2x2_TemporaryGeofencePolicyRollout_Update.lts"
    target: Stepwise_UpdCont_T2

  - id: drone_rebuilt_2drones_3x2x2_arrive_geofence_traditional_t2_start_after_stop_and_reconfigure
    example: DroneRebuilt_TemporaryArriveGeofencePolicyRollout_2Drones_3x2x2
    method: Traditional
    variant: t2_start_after_stop_and_reconfigure
    lts: "Experiment/LTS/DroneRebuilt/Drone_2Drones_3x2x2_TemporaryGeofencePolicyRollout_Update.lts"
    target: UpdCont_T2
