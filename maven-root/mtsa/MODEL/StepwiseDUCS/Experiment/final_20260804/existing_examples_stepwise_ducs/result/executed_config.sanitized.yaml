# Final paper-evaluation rerun for the existing Traditional DUCS examples.
#
# Run this configuration from the StepwiseDUCS distribution root (the
# directory that directly contains Experiment/) with the exact evaluation jar
# prepared for the final campaign. Existing run directories may be reused and
# matching artifacts overwritten when the experiment is intentionally rerun.
# JFR, phase-memory diagnostics, diagnostic GC logging, and the Windows-native
# lifetime high-water probe are disabled. The cross-platform 50 ms sampled
# heap/process-memory synthesis-window measurements remain enabled as paper
# metrics.
outputDir: "Experiment/final_20260804/existing_examples_stepwise_ducs/result"
runs: 3
timeoutHours: 12
requireFreshOutputDir: false
# Keep no_tr -> T1 -> T2 fixed. Within each variant, the five examples retain
# their YAML order, while the two methods swap order on even-numbered runs.
alternateMethodOrderByRun: true
validateMethodTarget: true
validateMemoryQuality: true
maxMemorySamplingGapMillis: 1000
requirementsCheck: false
traceCheck: false
notifyOn: always
slackWebhookUrl: "<redacted>"
notifyTimeoutSeconds: 30

javaOptions:
  - -Djava.awt.headless=true
  - -Dmtsa.evaluation.enabled=true
  - -Dupdating.controller.evaluation.profile=paper
  - -Dmtsa.evaluation.memorySampling.enabled=true
  - -Dmtsa.evaluation.memorySampling.intervalMillis=50
  - -Dmtsa.evaluation.rssSampling.enabled=true
  - -Dmtsa.evaluation.rssSampling.intervalMillis=50
  - -Dmtsa.evaluation.rssSampling.providerTimeoutMillis=5000
  - -Dmtsa.evaluation.memoryProtocol.ackTimeoutMillis=30000
  - -Dmtsa.evaluation.windowsPeakWorkingSet.enabled=false
  - -Dmtsa.evaluation.phaseMemoryDiagnostics=false
  - -Dstepwise.delayed.connectedEnvironmentView=true
  - -XX:+UseG1GC
  - -XX:+UnlockExperimentalVMOptions
  - -XX:G1MaxNewSizePercent=20
  - -Xmx220g

cases:
  - id: industry_stepwise_delayed_sbp_no_tr
    example: Industry
    method: stepwise_delayed+SBP
    variant: no_tr
    lts: "Experiment/LTS/Industry.lts"
    target: Stepwise_UpdCont
  - id: industry_stepwise_delayed_sbp_t1_no_controllable_during_gap
    example: Industry
    method: stepwise_delayed+SBP
    variant: t1_no_controllable_during_gap
    lts: "Experiment/LTS/Industry.lts"
    target: Stepwise_UpdCont_T1
  - id: industry_stepwise_delayed_sbp_t2_start_after_stop_and_reconfigure
    example: Industry
    method: stepwise_delayed+SBP
    variant: t2_start_after_stop_and_reconfigure
    lts: "Experiment/LTS/Industry.lts"
    target: Stepwise_UpdCont_T2

  - id: industry_traditional_no_tr
    example: Industry
    method: Traditional
    variant: no_tr
    lts: "Experiment/LTS/Industry.lts"
